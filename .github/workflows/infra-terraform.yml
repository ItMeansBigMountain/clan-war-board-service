name: infra-terraform

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infra-terraform.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra-terraform.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment gate
        type: choice
        options:
          - infra-dev
          - infra-prod
        default: infra-dev
      terraform_environment:
        description: Terraform tfvars environment
        type: choice
        options:
          - dev
          - prod
        default: dev
      apply:
        description: Apply Terraform plan after approval
        type: boolean
        default: false
      force_unlock_id:
        description: Stale Terraform lock ID to recover after confirming no run is active
        type: string
        required: false
        default: ''

permissions:
  contents: read
  pull-requests: write

env:
  ARM_USE_OIDC: false
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  terraform:
    name: Terraform plan/apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event.inputs.environment || 'infra-dev' }}
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight required GitHub variables
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
          TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
        run: |
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID TFSTATE_RESOURCE_GROUP TFSTATE_STORAGE_ACCOUNT TFSTATE_CONTAINER; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. Configure it as a repository/environment variable before running this workflow."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "See docs/github-actions-setup.md for the bootstrap sequence."
            exit 1
          fi

      - name: Azure login via service principal
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          enable-AzPSSession: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Select Terraform environment
        id: tfenv
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.terraform_environment }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=clan-war-board/${{ steps.tfenv.outputs.name }}.tfstate" \
            -backend-config="access_key=${{ secrets.TFSTATE_STORAGE_KEY }}"

      - name: Recover explicitly identified stale Terraform lock
        if: github.event_name == 'workflow_dispatch' && inputs.force_unlock_id != ''
        run: terraform force-unlock -force "${{ inputs.force_unlock_id }}"

      - name: Import existing dev resources into Terraform state
        if: steps.tfenv.outputs.name == 'dev'
        shell: bash
        run: |
          subscription="${{ vars.AZURE_SUBSCRIPTION_ID }}"
          rg="rg-cwb-dev"
          cosmos="cosmos-cwb-dev-0vksy9"
          swa="stapp-cwb-dev-0vksy9"
          database="clan-war-board"
          tfvars="env/dev.tfvars"

          import_if_missing() {
            local address="$1"
            local resource_id="$2"
            terraform state list | grep -Fxq "$address" || \
              timeout 5m terraform import -input=false -var-file="$tfvars" \
                -var="azure_subscription_id=$subscription" "$address" "$resource_id"
          }

          base="/subscriptions/$subscription/resourceGroups/$rg"
          cosmos_base="$base/providers/Microsoft.DocumentDB/databaseAccounts/$cosmos"
          database_base="$cosmos_base/sqlDatabases/$database"
          import_if_missing azurerm_resource_group.main "$base"
          import_if_missing azurerm_cosmosdb_account.main "$cosmos_base"
          import_if_missing azurerm_cosmosdb_sql_database.main "$database_base"
          import_if_missing azurerm_cosmosdb_sql_container.clans "$database_base/containers/clans"
          import_if_missing azurerm_cosmosdb_sql_container.wars "$database_base/containers/wars"
          import_if_missing azurerm_cosmosdb_sql_container.summaries "$database_base/containers/summaries"
          import_if_missing azurerm_static_web_app.web "$base/providers/Microsoft.Web/staticSites/$swa"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          terraform plan \
            -var-file="env/${{ steps.tfenv.outputs.name }}.tfvars" \
            -var="azure_subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            -out=tfplan

      - name: Upload Terraform plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ steps.tfenv.outputs.name }}
          path: infra/terraform/tfplan
          retention-days: 7

      - name: Terraform apply
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true'
        run: terraform apply -auto-approve tfplan

      - name: Show Terraform outputs
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true'
        run: terraform output